name: CI

on:
  pull_request:
  push:
    branches: [main, master, lean]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the changed-files lint can diff against the base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # ── Blocking gates ────────────────────────────────────────────────
      - name: Type-check
        run: npm run type-check

      # Every file a change touches must be lint-clean, so the backlog shrinks
      # instead of growing. The whole repo stays advisory (below) until it's cleared.
      - name: Lint changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; skipping."
            exit 0
          fi
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- '*.ts' '*.tsx' \
            | grep -v '^src/mocks/public/' > changed.txt || true
          if [ ! -s changed.txt ]; then
            echo "No TypeScript files changed."
            exit 0
          fi
          xargs npx eslint < changed.txt

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
        env:
          # The web3 bundle (appkit + walletconnect + Dynamic) exceeds Node's
          # default heap during minify; matches netlify.toml.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Bundle size report
        run: |
          echo "### Largest JS chunks" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find dist/assets -name '*.js' -printf '%s\t%p\n' 2>/dev/null \
            | sort -rn | head -10 \
            | awk '{ printf "%8.1f kB  %s\n", $1/1024, $2 }' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── Advisory: whole-repo lint, until the backlog is cleared ─────────
      - name: Lint whole repo (advisory)
        run: npm run lint
        continue-on-error: true

  security-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true
