<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Clip the top-left circle -->
    <clipPath id="clip-top-left">
      <rect x="0" y="0" width="207" height="207"/>
    </clipPath>

    <!-- Clip the bottom-right circle -->
    <clipPath id="clip-bottom-right">
      <rect x="203" y="203" width="207" height="207"/>
    </clipPath>
  </defs>

  <!-- 🔴 TOP-LEFT TEARDROP (circle + triangle as one object) -->
  <g id="teardrop-red">
    <g clip-path="url(#clip-top-left)">
      <circle cx="135" cy="135" r="75" fill="#FF3B30"/>
    </g>
    <polygon points="205,205 260,202.9 202.9,253" fill="#000000"/>
  </g>

  <!-- ⚫ BOTTOM-RIGHT TEARDROP (circle + triangle as one object) -->
  <g id="teardrop-black">
    <g clip-path="url(#clip-bottom-right)">
      <circle cx="275" cy="275" r="75" fill="#000000"/>
    </g>
    <polygon points="205,205 150,207.1 207.1,150" fill="#FF3B30"/>
  </g>

  <!-- Small circles -->
  <circle cx="270" cy="140" r="50" fill="#000000"/>
  <circle cx="140" cy="270" r="50" fill="#FF3B30"/>
</svg>
