[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
  NODE_OPTIONS = "--max-old-space-size=8192"
  # Optimize build performance
  CI = "true"
  # Disable telemetry to save resources
  NEXT_TELEMETRY_DISABLED = "1"