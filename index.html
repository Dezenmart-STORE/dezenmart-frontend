    <title>DezenMart - Secure Web3 Marketplace | Buy & Sell with Crypto</title>

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.coingecko.com" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://dezenmart.com/" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Inline styles for initial splash screen (prevents white flash) -->
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #212428;
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #212428 0%, #1a1c20 50%, #2a1820 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out;
        animation: gradientShift 8s ease-in-out infinite;
      }

      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-container {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 28rem;
        padding: 0 1rem;
      }

      .splash-glow {
        position: absolute;
        width: 12rem;
        height: 12rem;
        background: rgba(239, 68, 68, 0.2);
        border-radius: 50%;
        filter: blur(60px);
        animation: glowPulse 3s ease-in-out infinite;
      }

      .splash-logo-wrapper {
        position: relative;
        margin-bottom: 2rem;
        animation: fadeInScale 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .splash-ring {
        position: absolute;
        inset: 0;
        width: 128px;
        height: 128px;
        border: 2px solid;
        border-color: rgba(239, 68, 68, 0.8) rgba(239, 68, 68, 0.4) rgba(239, 68, 68, 0.1) rgba(239, 68, 68, 0.6);
        border-radius: 50%;
        animation: rotate 8s linear infinite, scaleRing 2s ease-in-out infinite;
      }

      .splash-logo {
        position: relative;
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.3));
        animation: float 2.5s ease-in-out infinite, glowLogo 2s ease-in-out infinite;
        z-index: 1;
      }

      .splash-title {
        color: white;
        font-size: 2rem;
        font-weight: bold;
        text-align: center;
        margin-bottom: 1.5rem;
        letter-spacing: 0.05em;
        animation: fadeInUp 0.6s ease-out 0.4s both;
      }

      .splash-subtitle {
        color: #9ca3af;
        font-size: 0.875rem;
        text-align: center;
        margin-top: 0.5rem;
        animation: fadeIn 0.5s ease-out 1s both;
      }

      .splash-progress {
        width: 100%;
        max-width: 20rem;
        margin-bottom: 1.5rem;
        animation: fadeInScale 0.5s ease-out 0.6s both;
      }

      .splash-progress-bg {
        height: 8px;
        background: rgba(31, 41, 55, 0.5);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(75, 85, 99, 0.3);
      }

      .splash-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #ef4444, #f87171, #ef4444);
        border-radius: 9999px;
        width: 0%;
        animation: loadProgress 2s ease-out forwards;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
      }

      .splash-progress-shimmer {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        animation: shimmer 2s linear infinite;
      }

      .splash-dots {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 2rem;
        animation: fadeIn 0.5s ease-out 0.9s both;
      }

      .splash-dot {
        width: 8px;
        height: 8px;
        background: #ef4444;
        border-radius: 50%;
      }

      .splash-dot:nth-child(1) {
        animation: dotPulse 1s ease-in-out infinite;
      }

      .splash-dot:nth-child(2) {
        animation: dotPulse 1s ease-in-out 0.2s infinite;
      }

      .splash-dot:nth-child(3) {
        animation: dotPulse 1s ease-in-out 0.4s infinite;
      }

      .splash-tags {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
        animation: fadeInUp 0.5s ease-out 1.1s both;
      }

      .splash-tag {
        padding: 0.25rem 0.75rem;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 9999px;
        color: #ef4444;
        font-size: 0.75rem;
        font-weight: 500;
      }

      .splash-powered {
        position: absolute;
        bottom: 2rem;
        color: #6b7280;
        font-size: 0.75rem;
        animation: fadeIn 0.5s ease-out 1.5s both;
      }

      @keyframes gradientShift {
        0%, 100% {
          background: linear-gradient(135deg, #212428 0%, #1a1c20 50%, #2a1820 100%);
        }
        33% {
          background: linear-gradient(135deg, #2a1820 0%, #212428 50%, #1a1c20 100%);
        }
        66% {
          background: linear-gradient(135deg, #1a1c20 0%, #2a1820 50%, #212428 100%);
        }
      }

      @keyframes glowPulse {
        0%, 100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 0.5;
          transform: scale(1.2);
        }
      }

      @keyframes fadeInScale {
        from {
          opacity: 0;
          transform: scale(0) rotate(-180deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes rotate {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes scaleRing {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      @keyframes glowLogo {
        0%, 100% {
          filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.3));
        }
        50% {
          filter: drop-shadow(0 0 40px rgba(239, 68, 68, 0.6));
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes loadProgress {
        to {
          width: 100%;
        }
      }

      @keyframes shimmer {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(200%);
        }
      }

      @keyframes dotPulse {
        0%, 100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.5);
        }
      }

      @media (max-width: 640px) {
        .splash-logo-wrapper {
          margin-bottom: 1.5rem;
        }
        .splash-ring,
        .splash-logo {
          width: 80px;
          height: 80px;
        }
        .splash-title {
          font-size: 1.5rem;
        }
        .splash-glow {
          width: 10rem;
          height: 10rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Initial splash screen (shown before React loads) -->
    <div id="splash-screen">
      <div class="splash-container">
        <div class="splash-glow"></div>

        <div class="splash-logo-wrapper">
          <div class="splash-ring"></div>
          <img src="/images/logo.svg" alt="DezenMart" class="splash-logo" />
        </div>

        <h1 class="splash-title">DezenMart</h1>
        <p class="splash-subtitle">Your Web3 Marketplace</p>

        <div class="splash-progress">
          <div class="splash-progress-bg">
            <div class="splash-progress-shimmer"></div>
            <div class="splash-progress-bar"></div>
          </div>
        </div>

        <div class="splash-dots">
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
          <div class="splash-dot"></div>
        </div>

        <div class="splash-tags">
          <span class="splash-tag">Secure</span>
          <span class="splash-tag">Decentralized</span>
          <span class="splash-tag">Fast</span>
        </div>
      </div>

      <p class="splash-powered">Powered by Celo Blockchain</p>
    </div>

    <div id="root" class="relative"></div>

    <!-- Hide splash screen when React loads -->
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          const splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('hidden');
            setTimeout(function() {
              splash.remove();
            }, 500);
          }
        }, 100);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
