<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Basic Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="Decentralized Web3 marketplace on Celo blockchain with secure P2P trading, escrow contracts, and multi-stablecoin support" />
    <meta name="keywords" content="dezenmart, web3, marketplace, celo, blockchain, decentralized, trading, escrow, crypto" />
    <meta name="author" content="Dezenmart" />

    <!-- Theme & App Meta -->
    <meta name="theme-color" content="#6366F1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Dezenmart" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="shortcut icon" href="/images/logo.png" />

    <!-- PWA Icons -->
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dezenmart" />

    <!-- Android PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Windows Metro Tile -->
    <meta name="msapplication-TileColor" content="#6366F1" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dezenmart - Decentralized Marketplace" />
    <meta property="og:description" content="Secure P2P trading on Celo blockchain with multi-stablecoin support" />
    <meta property="og:image" content="/images/logo.png" />
    <meta property="og:url" content="https://dezenmart.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dezenmart - Decentralized Marketplace" />
    <meta name="twitter:description" content="Secure P2P trading on Celo blockchain with multi-stablecoin support" />
    <meta name="twitter:image" content="/images/logo.png" />

    <!-- Security -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

    <title>Dezenmart - Decentralized Marketplace</title>

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root" class="relative"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
