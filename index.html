      #splash-screen {

      }

        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom right, #212428, #1a1c20, #212428);
      }

      }

      .splash-svg {
        width: 8rem;
        height: 8rem;
        opacity: 0;
        animation: svgFadeInOut 4.5s ease-in-out infinite;
      }

      /* SVG Element Animations */
      .red-circle-fill {
        opacity: 0;
        animation: redCircleFill 4.5s ease-in infinite;
      }

      .red-circle-stroke {
        stroke-dasharray: 471.24;
        stroke-dashoffset: 471.24;
        animation: redCircleStroke 4.5s ease-out infinite;
      }

      .white-triangle-fill {
        opacity: 0;
        animation: whiteTriangleFill 4.5s ease-in infinite;
      }

      .white-triangle-stroke {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: whiteTriangleStroke 4.5s ease-out infinite;
      }

      .white-circle-fill {
        opacity: 0;
        animation: whiteCircleFill 4.5s ease-in infinite;
      }

      .white-circle-stroke {
        stroke-dasharray: 471.24;
        stroke-dashoffset: 471.24;
        animation: whiteCircleStroke 4.5s ease-out infinite;
      }

      .red-triangle-fill {
        opacity: 0;
        animation: redTriangleFill 4.5s ease-in infinite;
      }

      .red-triangle-stroke {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: redTriangleStroke 4.5s ease-out infinite;
      }

      .small-white-circle-fill {
        opacity: 0;
        animation: smallWhiteCircleFill 4.5s ease-in infinite;
      }

      .small-white-circle-stroke {
        stroke-dasharray: 314.16;
        stroke-dashoffset: 314.16;
        animation: smallWhiteCircleStroke 4.5s ease-out infinite;
      }

      .small-red-circle-fill {
        opacity: 0;
        animation: smallRedCircleFill 4.5s ease-in infinite;
      }

      .small-red-circle-stroke {
        stroke-dasharray: 314.16;
        stroke-dashoffset: 314.16;
        animation: smallRedCircleStroke 4.5s ease-out infinite;
      }

      .splash-title {

        font-size: 1.875rem;
        font-weight: bold;
        text-align: center;
        letter-spacing: 0.05em;
        opacity: 0;
        animation: titleFadeIn 0.6s ease-out 0.8s forwards;
      }

      /* Keyframe Animations */
      @keyframes svgFadeInOut {
        0% {
          opacity: 0;
        }
        5% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        95% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }

      @keyframes redCircleFill {

        27% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
        90%,
        95% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }

    <div id="root" class="relative"></div>

    <!-- Hide splash screen when React loads -->
    <script>
      (function () {
        const MIN_SPLASH_DURATION = 4600;
        const splash = document.getElementById("splash-screen");
        if (!splash) return;

        const mediaQuery = window.matchMedia
          ? window.matchMedia("(display-mode: standalone)")
          : null;
        const isIOSStandalone =
          "standalone" in window.navigator && window.navigator.standalone;
        const isStandalone = Boolean(mediaQuery?.matches || isIOSStandalone);

        window.__APP_IS_STANDALONE__ = isStandalone;

        const hideSplash = (delay = 0) => {
          window.setTimeout(() => {
            splash.classList.add("hidden");
            window.setTimeout(() => splash.remove(), 500);
          }, delay);
        };

        if (isStandalone) {
          hideSplash(MIN_SPLASH_DURATION);
        } else {
          hideSplash();
        }
      })();
    </script>
